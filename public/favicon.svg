<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e18"/>
      <stop offset="100%" stop-color="#10100c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d9ff43" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="#282820" stroke-width="3"/>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="none" stroke="#d9ff43" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Accent sparkles -->
  <!-- Top-right purple sparkle -->
  <path d="M 96 20 Q 96 30 106 30 Q 96 30 96 40 Q 96 30 86 30 Q 96 30 96 20 Z" fill="#9d7eff"/>

  <!-- Bottom-left mini star -->
  <circle cx="28" cy="98" r="3" fill="#d9ff43" opacity="0.8"/>

  <!-- Main 4-pointed Star in Acid Lime with glow -->
  <g filter="url(#glow)">
    <path d="M 64 24 Q 64 64 104 64 Q 64 64 64 104 Q 64 64 24 64 Q 64 64 64 24 Z" fill="#d9ff43"/>
    <!-- Star center core highlight -->
    <circle cx="64" cy="64" r="5" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
